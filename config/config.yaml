# AI CAD Copilot 配置文件
# 优先级：环境变量 (.env) > config.yaml > 内置默认值
# 敏感信息（API Key）仅放 .env，不入此文件

app:
  name: AI CAD Copilot
  version: 0.2.0
  host: 127.0.0.1
  port: 8000
  cors_origins: ["http://127.0.0.1:8000", "http://localhost:8000", "http://127.0.0.1:5173", "http://localhost:5173"]

freecad:
  # FreeCADCmd 可执行文件路径；留空则自动探测（env FREECAD_BIN 优先）
  bin: ""
  # FreeCAD 子进程超时（秒）
  run_timeout: 900
  max_retries: 2

output:
  dir: output
  # 会话 TTL（秒）
  sessions_ttl_sec: 7200

llm:
  # DeepSeek API（env DEEPSEEK_BASE_URL / DEEPSEEK_MODEL 优先）
  base_url: https://api.deepseek.com
  model: deepseek-chat
  temperature: 0.1
  timeout: 180
  # Agent 最大执行步数（langgraph recursion_limit）
  agent_recursion_limit: 50

logging:
  level: INFO
  file: output/logs/app.log
  max_bytes: 5242880    # 5MB 滚动
  backup_count: 3
